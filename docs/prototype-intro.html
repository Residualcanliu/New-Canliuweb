  <span class="hint">空格 播放 · ←→ 逐帧 · R 重播</span>
</div>

<script>
const W = 1440, H = 900;

const TL = {
  black:  [0.00, 0.30],
  fly:    [0.30, 2.00],
  settle: [2.00, 2.45],
  freeze: [2.45, 2.60],
  open:   [2.60, 3.80],
  focus:  [2.70, 3.70],
  exit:   [3.82, 4.40],
  END:    4.40
};

/* 飞行路径：起点贴在左边缘外侧一点点，一进场就贴边 */
const P0 = [-40, 520], P1 = [170, 592], P2 = [430, 468], P3 = [720, 414];

function bez(u){
  const m = 1 - u;
  const a = m*m*m, b = 3*m*m*u, c = 3*m*u*u, d = u*u*u;
  return [a*P0[0]+b*P1[0]+c*P2[0]+d*P3[0], a*P0[1]+b*P1[1]+c*P2[1]+d*P3[1]];
}
function tang(u){
  const m = 1 - u;
  const dx = 3*m*m*(P1[0]-P0[0]) + 6*m*u*(P2[0]-P1[0]) + 3*u*u*(P3[0]-P2[0]);
  const dy = 3*m*m*(P1[1]-P0[1]) + 6*m*u*(P2[1]-P1[1]) + 3*u*u*(P3[1]-P2[1]);
  return Math.atan2(dy, dx) * 180 / Math.PI;
}
function norm(u){
  const a = tang(u) * Math.PI / 180;
  return [Math.sin(a), -Math.cos(a)];
}

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const smoothstep = t => t*t*(3-2*t);
const rnd = i => { const x = Math.sin(i*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function nz(u, seed){
  return Math.sin(u*11.3 + seed)*0.5 + Math.sin(u*23.7 + seed*2.1)*0.3 + Math.sin(u*46.9 + seed*3.7)*0.2;
}

/* 速度曲线：整体减速，中段略微"试探"地收一下，不是一根匀速滑轨 */
function uAt(t){
  if (t <= TL.fly[0]) return 0;
  if (t >= TL.fly[1]) return 1;
  const tn = (t - TL.fly[0]) / (TL.fly[1] - TL.fly[0]);
  const e = 1 - Math.pow(1 - tn, 2.3);
  return tn + (e - tn) * (1 - 0.42 * Math.sin(Math.PI * tn));
}
function tAtU(u){
  let lo = 0, hi = 1;
  for (let k = 0; k < 26; k++){
    const mid = (lo + hi) / 2;
    if (uAt(TL.fly[0] + mid * (TL.fly[1] - TL.fly[0])) < u) lo = mid; else hi = mid;
  }
  return TL.fly[0] + (lo + hi) / 2 * (TL.fly[1] - TL.fly[0]);
}

/* 上下浮动：贴着飞行方向漂，抵达后收掉，静止段必须是死的 */
function bobAt(t){
  if (t < TL.fly[0]) return 0;
  const A = 17 * clamp01(1 - (t - TL.fly[1]) / 0.42);
  if (A <= 0) return 0;
  const ft = t - TL.fly[0];
  return A * (Math.sin(2*Math.PI*0.78*ft + 0.6) + 0.6*Math.sin(2*Math.PI*0.31*ft + 2.1));
}

/* 轨迹采样：位置 = 曲线 + 法线方向的浮动，所以轨迹就是真实飞过的路 */
const N = 260;
const TRAIL = [];
for (let i = 0; i <= N; i++){
  const u = i / N;
  const ti = tAtU(u);
  const [x, y] = bez(u);
  const [nx, ny] = norm(u);
  const bo = bobAt(ti);
  TRAIL.push({ u, x: x + nx*bo, y: y + ny*bo, t: ti, w: (1.5 + 8.2*u) * 1.5 });
}

const cvs = document.getElementById('fx');
const ctx = cvs.getContext('2d');
const bfly = document.getElementById('bfly');
const content = document.getElementById('content');
const scrub = document.getElementById('scrub');
const tTime = document.getElementById('tTime');
const tPhase = document.getElementById('tPhase');
const hud = document.getElementById('hud');
const btnPlay = document.getElementById('btnPlay');
const btnReplay = document.getElementById('btnReplay');
const btnSlow = document.getElementById('btnSlow');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
cvs.width = W*DPR; cvs.height = H*DPR;
cvs.style.width = W+'px'; cvs.style.height = H+'px';
ctx.scale(DPR, DPR);

const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ---------------- 轨迹 ---------------- */
function drawTrail(t, alphaMul){
  if (alphaMul <= 0.001) return;
  ctx.lineCap = 'round';
  const body = bez(uAt(t));
  const GAP = 58;
  for (let i = 0; i < TRAIL.length - 1; i++){
    const a = TRAIL[i], b = TRAIL[i+1];
    if (a.t > t) break;
    if (Math.hypot(b.x-body[0], b.y-body[1]) < GAP) break;
    const age = t - a.t;
    const wh = smoothstep(clamp01((age - 0.015) / 0.40));
    const al = (0.04 + 0.96*wh) * alphaMul;
    if (al < 0.012) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = 'rgba(255,255,255,' + (al*0.13).toFixed(3) + ')';
    ctx.lineWidth = b.w * 2.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = 'rgba(255,255,255,' + al.toFixed(3) + ')';
    ctx.lineWidth = b.w;
    ctx.stroke();
  }
}

/* ---------------- 裂口 ---------------- */
/* 缝的中线：沿着蝴蝶飞过的轨迹，再顺着末端的切线延伸到画面右边 */
const APEX_U = 0.93;
const SEAM = (function(){
  const pts = [];
  const M = 74;
  for (let i = 0; i <= M; i++){
    const u = (i/M) * APEX_U;
    const [x, y] = bez(u);
    const [nx, ny] = norm(u);
    pts.push({ x, y, nx, ny });
  }
  const last = pts[pts.length-1];
  const th = tang(APEX_U) * Math.PI/180;
  const dx = Math.cos(th), dy = Math.sin(th);
  for (let k = 1; k <= 3; k++){
    pts.push({ x: last.x + dx*28*k, y: last.y + dy*28*k, nx: Math.sin(th), ny: -Math.cos(th) });
  }
  for (let i = 0; i < pts.length; i++) pts[i].s = i / (pts.length - 1);
  return pts;
})();
const APEX_S = (function(){
  let best = 0, bd = 1e9;
  const a = bez(APEX_U);
  for (const p of SEAM){
    const d = Math.hypot(p.x-a[0], p.y-a[1]);
    if (d < bd){ bd = d; best = p.s; }
  }
  return best;
})();

function buildHole(openP){
  if (openP <= 0.001) return null;
  const maxD = 430 * openP + 330 * Math.pow(openP, 3);
  const up = [], dn = [];
  for (const p of SEAM){
    const k = Math.pow(Math.abs(p.s - APEX_S) / Math.max(APEX_S, 0.001), 0.55);
    const wob = 1 + 0.025 * nz(p.s * 4.0, 1.7);
    const dU = maxD * k * wob;
    const dN = maxD * k * wob * 0.86;
    up.push([p.x + p.nx*dU, p.y + p.ny*dU]);
    dn.push([p.x - p.nx*dN, p.y - p.ny*dN]);
  }
  return { up, dn, maxD };
}

function strokePoly(pts, w, style, dash){
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = w;
  ctx.strokeStyle = style;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  if (dash) ctx.setLineDash([]);
}

function drawLid(t){
  const openP = easeInOutCubic(clamp01((t - TL.open[0]) / (TL.open[1] - TL.open[0])));
  const lidAlpha = 1 - clamp01((t - 3.74) / 0.26);
  const hole = buildHole(openP);

  if (lidAlpha > 0.002){
    const p = new Path2D();
    p.rect(0, 0, W, H);
    if (hole){
      const { up, dn } = hole;
      p.moveTo(up[0][0], up[0][1]);
      for (let i = 1; i < up.length; i++) p.lineTo(up[i][0], up[i][1]);
      for (let i = dn.length - 1; i >= 0; i--) p.lineTo(dn[i][0], dn[i][1]);
      p.closePath();
    }
    ctx.fillStyle = 'rgba(0,0,0,' + lidAlpha.toFixed(3) + ')';
    ctx.fill(p, 'evenodd');

    if (hole){
      const q = new Path2D();
      const { up, dn } = hole;
      q.moveTo(up[0][0], up[0][1]);
      for (let i = 1; i < up.length; i++) q.lineTo(up[i][0], up[i][1]);
      for (let i = dn.length - 1; i >= 0; i--) q.lineTo(dn[i][0], dn[i][1]);
      q.closePath();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.030*lidAlpha).toFixed(4) + ')';
      ctx.fill(q);
    }
  }

  if (hole && openP > 0.01){
    const fade = 1 - clamp01((t - 3.78) / 0.20);

    /* 黑幕内侧的厚度阴影：让开口像"被撕开的一层"，不是一块透明玻璃 */
    strokePoly(hole.up, 46, 'rgba(0,0,0,' + (0.30*fade).toFixed(3) + ')');
    strokePoly(hole.dn, 46, 'rgba(0,0,0,' + (0.30*fade).toFixed(3) + ')');
    strokePoly(hole.up, 22, 'rgba(0,0,0,' + (0.26*fade).toFixed(3) + ')');
    strokePoly(hole.dn, 22, 'rgba(0,0,0,' + (0.26*fade).toFixed(3) + ')');

    /* 缝口白边：宽度沿路径起伏，再叠一层扩散，读起来是光不是描边 */
    const a0 = 0.95 * fade;
    const toPath = (pts) => {
      const q = new Path2D();
      q.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) q.lineTo(pts[i][0], pts[i][1]);
      return q;
    };
    const pu = toPath(hole.up), pd = toPath(hole.dn);
    [[1, 1], [2.2, 0.18], [4.0, 0.055]].forEach(pair => {
      ctx.lineWidth = 2.2 * pair[0];
      ctx.strokeStyle = 'rgba(255,255,255,' + (a0 * pair[1]).toFixed(3) + ')';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke(pu);
      ctx.stroke(pd);
    });

    /* 纤维：断口上挂着的细毛，往黑幕那侧飘 */
    for (let i = 0; i < 44; i++){
      const s = rnd(i*3.7 + 1);
      const idx = Math.min(SEAM.length-1, Math.floor(s * (SEAM.length-1)));
      const p = SEAM[idx];
      const side = (i % 2 === 0) ? 1 : -1;
      const arr = side > 0 ? hole.up : hole.dn;
      const base = arr[idx];
      const len = 7 + 17*rnd(i*5.1+2);
      const ux = p.nx*side, uy = p.ny*side;
      const k = Math.pow(Math.abs(p.s - APEX_S)/Math.max(APEX_S,1-APEX_S), 0.55);
      if (k < 0.12) continue;
      ctx.beginPath();
      ctx.moveTo(base[0], base[1]);
      ctx.lineTo(base[0] + ux*len, base[1] + uy*len);
      ctx.lineWidth = 0.8 + 0.7*rnd(i*1.3);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5*fade*(0.4+0.6*rnd(i*9.1))).toFixed(3) + ')';
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    /* 碎屑：断口一路崩出来的白点，往外飘一段就消失 */
    for (let i = 0; i < 46; i++){
      const s = rnd(i*2.9 + 5);
      const idx = Math.min(SEAM.length-1, Math.floor(s * (SEAM.length-1)));
      const p = SEAM[idx];
      const side = rnd(i*7.7) > 0.5 ? 1 : -1;
      const arr = side > 0 ? hole.up : hole.dn;
      const base = arr[idx];
      const birth = TL.open[0] + 1.05 * Math.pow(Math.abs(p.s - APEX_S)/Math.max(APEX_S,1-APEX_S), 0.55);
      const age = t - birth;
      if (age < 0 || age > 1.15) continue;
      const drift = 26 + 78*age;
      const jx = (rnd(i*11.3)-0.5) * 26;
      const jy = (rnd(i*13.7)-0.5) * 26;
      ctx.beginPath();
      ctx.arc(base[0] + p.nx*side*drift + jx, base[1] + p.ny*side*drift + jy,
              0.7 + 1.5*rnd(i*3.1), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.72*(1-age/1.15)*fade).toFixed(3) + ')';
      ctx.fill();
    }
  }
  return openP;
}

function drawResidual(t){
  const a = clamp01((t - 3.90) / 0.34) * 0.5;
  if (a <= 0.01) return;
  ctx.beginPath();
  ctx.moveTo(0, 716);
  ctx.bezierCurveTo(240, 716, 460, 760, 720, 760);
  ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(720, 760); ctx.lineTo(1368, 760);
  ctx.strokeStyle = 'rgba(255,255,255,' + (a*0.28).toFixed(3) + ')';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ---------------- 蝴蝶 ---------------- */
const BASE_W = 172;
function layoutButterfly(t){
  const u = uAt(t);
  const [x0, y0] = bez(u);
  const bo = bobAt(t);
  const [nx, ny] = norm(u);

  const flyT = Math.min(t, TL.fly[1]);
  const settleT = Math.max(0, Math.min(t, TL.settle[1]) - TL.fly[1]);
  const phase = 2*Math.PI*(5.2*flyT + 2.4*settleT);

  let amp = 0;
  if (t > TL.fly[0] && t < TL.settle[1]){
    amp = 0.085 * clamp01(1 - Math.max(0, t - TL.fly[1]) / 0.42);
  }
  const flap = Math.abs(Math.sin(phase));

  const s = 1 - 0.08*u;
  const w = BASE_W * s;
  const h = w * (620/573);

  let rot = tang(u) + 4.5*Math.sin(2*Math.PI*0.85*(t-TL.fly[0]) + 1.1);
  rot = Math.max(-24, Math.min(18, rot));
  if (t > TL.fly[1]) rot += Math.min(1, (t - TL.fly[1]) / 0.5) * 7;

  const sy = 1 - amp*flap*1.2;
  const sx = 1 + amp*flap*0.2;

  let ox = 0, oy = 0, op = (t < TL.fly[0]) ? 0 : 1;
  if (t > TL.exit[0]){
    const p = easeOutCubic(clamp01((t - TL.exit[0]) / (TL.exit[1] - TL.exit[0])));
    ox = 300*p; oy = -280*p; op = 1 - clamp01((p - 0.25)/0.6);
  }

  bfly.style.width = w + 'px';
  bfly.style.height = h + 'px';
  bfly.style.opacity = op.toFixed(3);
  bfly.style.transform =
    'translate(' + (x0 + nx*bo - w*0.62 + ox).toFixed(2) + 'px,' + (y0 + ny*bo - h*0.5 + oy).toFixed(2) + 'px) ' +
    'rotate(' + rot.toFixed(2) + 'deg) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
}

/* ---------------- 内容 ---------------- */
function layoutContent(t){
  const p = easeOutCubic(clamp01((t - TL.focus[0]) / (TL.focus[1] - TL.focus[0])));
  const blur = 9 * (1 - p);
  const op = 0.40 + 0.60*p;
  const y = 16 * (1 - p);
  const sc = 1.028 - 0.028*p;
  content.style.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
  content.style.opacity = op.toFixed(3);
  content.style.transform = 'translateY(' + y.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')';
  content.style.transformOrigin = '50% 46%';
}

function render(t){
  ctx.clearRect(0, 0, W, H);
  const openP = easeInOutCubic(clamp01((t - TL.open[0]) / (TL.open[1] - TL.open[0])));
  drawLid(t);
  drawTrail(t, 1 - clamp01((openP - 0.05) / 0.30));
  drawResidual(t);
  layoutContent(t);
  layoutButterfly(t);
}

let t = 0, playing = true, rate = 1, last = performance.now();

function phaseName(t){
  if (t < TL.black[1]) return '黑场';
  if (t < TL.fly[1]) return '飞行';
  if (t < TL.settle[1]) return '抵达';
  if (t < TL.open[0]) return '静止';
  if (t < TL.open[1]) return '裂开';
  if (t < TL.focus[1]) return '对焦';
  return '落位';
}

function tick(now){
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  if (playing){
    t += dt * rate;
    if (t >= TL.END){ t = TL.END; playing = false; btnPlay.textContent = '播放'; }
  }
  render(t);
  scrub.value = t;
  tTime.textContent = t.toFixed(2).padStart(4,'0') + ' / ' + TL.END.toFixed(2);
  tPhase.textContent = phaseName(t);
  requestAnimationFrame(tick);
}

btnPlay.addEventListener('click', () => {
  if (t >= TL.END) t = 0;
  playing = !playing;
  btnPlay.textContent = playing ? '暂停' : '播放';
});
btnReplay.addEventListener('click', () => { t = 0; playing = true; btnPlay.textContent = '暂停'; });
btnSlow.addEventListener('click', () => {
  rate = rate === 1 ? 0.25 : 1;
  btnSlow.classList.toggle('on', rate !== 1);
});
scrub.addEventListener('input', e => { t = parseFloat(e.target.value); playing = false; btnPlay.textContent = '播放'; });

window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); btnPlay.click(); }
  if (e.code === 'ArrowRight'){ e.preventDefault(); playing = false; btnPlay.textContent='播放'; t = Math.min(TL.END, t + 1/60); }
  if (e.code === 'ArrowLeft'){ e.preventDefault(); playing = false; btnPlay.textContent='播放'; t = Math.max(0, t - 1/60); }
  if (e.key === 'r' || e.key === 'R'){ btnReplay.click(); }
});

let idleTimer;
function wake(){
  hud.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => hud.classList.add('idle'), 2600);
}
window.addEventListener('pointermove', wake);
window.addEventListener('pointerdown', wake);
wake();

(function(){
  const m = location.hash.match(/t=([0-9.]+)/);
  if (m){ t = Math.min(TL.END, parseFloat(m[1])); playing = false; btnPlay.textContent = '播放'; }
})();

requestAnimationFrame(tick);

</script>
</body>
</html>
